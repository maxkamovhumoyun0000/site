<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <title>Texnik ishlar — Diamond Education</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #071126; color: #f8fafc; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, #133c90 0, #071126 56%); }
    main { width: min(100%, 560px); padding: clamp(28px, 7vw, 56px); text-align: center; border: 1px solid #ffffff26; border-radius: 28px; background: #ffffff0d; box-shadow: 0 28px 90px #0006; }
    .mark { display: grid; place-items: center; width: 68px; height: 68px; margin: 0 auto 24px; border-radius: 22px; background: #2157f31c; color: #79a2ff; font-size: 32px; }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 34px); line-height: 1.2; letter-spacing: -.03em; }
    p { margin: 14px 0 0; color: #cbd5e1; font-size: 16px; line-height: 1.7; }
    .brand { margin-top: 32px; color: #93a4bf; font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">⚙</div>
    <h1 id="title">Texnik ishlar olib borilmoqda</h1>
    <p id="message">Sayt va ilovalar yangilanmoqda. Iltimos, birozdan so‘ng qayta urinib ko‘ring.</p>
    <div class="brand">Diamond Education</div>
  </main>
  <script>
    (() => {
      const lang = (navigator.language || "uz").toLowerCase().slice(0, 2);
      const copy = {
        uz: ["Texnik ishlar olib borilmoqda", "Sayt va ilovalar yangilanmoqda. Iltimos, birozdan so‘ng qayta urinib ko‘ring."],
        ru: ["Проводятся технические работы", "Сайт и приложения обновляются. Пожалуйста, попробуйте снова немного позже."],
        en: ["We’re doing some maintenance", "The website and apps are being updated. Please try again shortly."]
      };
      const text = copy[lang] || copy.en;
      document.documentElement.lang = copy[lang] ? lang : "en";
      document.title = `${text[0]} — Diamond Education`;
      document.getElementById("title").textContent = text[0];
      document.getElementById("message").textContent = text[1];
    })();
  </script>
</body>
</html>
