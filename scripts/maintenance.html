<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>Texnik ishlar — Diamond Education</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f7ff; color: #101938; }
    * { box-sizing: border-box; }
    :root[data-theme="dark"] { color-scheme: dark; background: #071126; color: #f8fafc; }
    body { --page-start: #dce7ff; --page-end: #f4f7ff; --card: #ffffff; --border: #dce4f4; --muted: #5c6680; --brand: #1429f2; min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0%, var(--page-start) 0, var(--page-end) 65%); transition: background .25s ease, color .25s ease; }
    :root[data-theme="dark"] body { --page-start: #133c90; --page-end: #071126; --card: #14264b; --border: #ffffff26; --muted: #cbd5e1; --brand: #79a2ff; }
    .layout { position: relative; width: min(100%, 560px); }
    main { width: 100%; padding: clamp(32px, 7vw, 56px); text-align: center; border: 1px solid var(--border); border-radius: 28px; background: var(--card); box-shadow: 0 28px 90px #10224a22; transition: background .25s ease, border-color .25s ease, color .25s ease; }
    :root[data-theme="dark"] main { background: #ffffff0d; box-shadow: 0 28px 90px #0006; }
    .tools { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; }
    .tools button { min-width: 40px; height: 40px; border: 1px solid var(--border); border-radius: 14px; background: var(--card); color: inherit; font: inherit; font-size: 17px; cursor: pointer; }
    .mark { display: grid; place-items: center; width: 68px; height: 68px; margin: 10px auto 24px; border-radius: 22px; background: #2157f31c; color: var(--brand); font-size: 32px; }
    h1 { margin: 0; font-size: clamp(24px, 5vw, 34px); line-height: 1.2; letter-spacing: -.03em; }
    p { margin: 14px 0 0; color: var(--muted); font-size: 16px; line-height: 1.7; }
    .brand { margin-top: 32px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="layout">
    <div class="tools" aria-label="Display settings">
      <button id="theme" type="button" aria-label="Theme" title="Theme">☀️</button>
      <button id="language" type="button" aria-label="Language" title="Language">UZ</button>
    </div>
    <main role="status" aria-live="polite">
      <div class="mark" aria-hidden="true">⚙</div>
      <h1 id="title">Texnik ishlar olib borilmoqda</h1>
      <p id="message">Sayt va ilovalar yangilanmoqda. Taxminan 30 daqiqa ichida qaytamiz.</p>
      <div class="brand">Diamond Education</div>
    </main>
  </div>
  <script>
    (() => {
      const languages = ["uz", "ru", "en"];
      let lang = (localStorage.getItem("diamond_locale") || navigator.language || "uz").toLowerCase().slice(0, 2);
      if (!languages.includes(lang)) lang = "en";
      const copy = {
        uz: ["Texnik ishlar olib borilmoqda", "Sayt va ilovalar yangilanmoqda. Taxminan 30 daqiqa ichida qaytamiz."],
        ru: ["Проводятся технические работы", "Сайт и приложения обновляются. Ориентировочно вернёмся через 30 минут."],
        en: ["We’re doing some maintenance", "The website and apps are being updated. We expect to be back in about 30 minutes."]
      };
      const themeButton = document.getElementById("theme");
      const languageButton = document.getElementById("language");
      const root = document.documentElement;
      function render() {
        const text = copy[lang];
        const dark = root.dataset.theme === "dark";
        root.lang = lang;
        document.title = `${text[0]} — Diamond Education`;
        document.getElementById("title").textContent = text[0];
        document.getElementById("message").textContent = text[1];
        themeButton.textContent = dark ? "🌙" : "☀️";
        themeButton.title = dark ? "Switch to light theme" : "Switch to dark theme";
        themeButton.setAttribute("aria-label", themeButton.title);
        languageButton.textContent = lang.toUpperCase();
        languageButton.title = "Change language";
      }
      const token = localStorage.getItem("diamond_token");
      const savedTheme = localStorage.getItem("diamond_theme");
      root.dataset.theme = token && (savedTheme === "dark" || savedTheme === "light") ? savedTheme : "light";
      themeButton.addEventListener("click", () => {
        root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
        localStorage.setItem("diamond_theme", root.dataset.theme);
        render();
      });
      languageButton.addEventListener("click", () => {
        lang = languages[(languages.indexOf(lang) + 1) % languages.length];
        localStorage.setItem("diamond_locale", lang);
        render();
      });
      render();
    })();
  </script>
</body>
</html>
