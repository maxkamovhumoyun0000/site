name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow GITHUB_TOKEN: CI only needs to read code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit production dependencies
        # Reports known-vulnerable packages; non-blocking until the current
        # baseline is triaged so it cannot break unrelated releases.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Check backend syntax
        run: |
          python3 -m py_compile \
            backend/main.py backend/speaking_admin.py backend/personalization.py \
            db.py config.py userbot_manager.py \
            admin_bot.py student_bot.py teacher_bot.py support_lesson.py

      - name: Website API contract tests
        # Stdlib only: checks website API paths against backend routes and
        # the Speaking admin workspace guard without a database.
        run: python3 tests/test_website_api_contracts.py
