name: Legacy browser audit

on:
  workflow_dispatch:
  schedule:
    - cron: "20 1 * * 1"

jobs:
  legacy-browser-journeys:
    # Keep old UX scenarios visible without making unrelated releases wait for
    # their known compatibility gaps to time out.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Audit historical browser journeys
        continue-on-error: true
        run: npm run e2e:smoke

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
